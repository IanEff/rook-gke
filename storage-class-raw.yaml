# Kubernetes StorageClass for Rook-Ceph OSDs on GKE
#
# NOTE: volumeMode is a property of the PersistentVolumeClaim (PVC) or 
# Rook CephCluster volume claim template, NOT the StorageClass itself.
# To request raw block storage, specify `volumeMode: Block` in the PVC
# or Rook CephCluster CRD spec under storageClassDeviceSets (see rook-cluster-osds-snippet.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-raw-block
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-balanced # Options: pd-balanced (recommended), pd-ssd, pd-standard
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer # Required: binds PV to node in the correct zone
allowVolumeExpansion: true
