# state-queries.yaml maps `dependsOn` resource/component names from catalog-info.yaml
# to the PromQL query that determines their health/up-state.
# This file is loaded by the whir dependency resolver.

queries:
  "resource:default/cephobjectstore": "up{job=\"rook-ceph-mgr\"} == 1"
  "component:default/rook-operator": "up{job=\"rook-ceph-operator\"} == 1"
  "resource:default/cephblockpool": "ceph_pool_stored > 0"
  "resource:default/cephcluster": "ceph_health_status == 0"
  "resource:default/gke-rook-ceph-gke-rook-ceph-gke-node--1abe8375-mwcx": "kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 1"
  "resource:default/gke-rook-ceph-gke-rook-ceph-gke-node--400af229-b9qp": "kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 1"
  "resource:default/gke-rook-ceph-gke-rook-ceph-gke-node--c237685c-6h1k": "kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 1"
  "resource:default/gke-rook-ceph-gke-rook-ceph-gke-node--1abe8375-mwcx-disk": "kubelet_volume_stats_capacity_bytes > 0"
  "resource:default/gke-rook-ceph-gke-rook-ceph-gke-node--400af229-b9qp-disk": "kubelet_volume_stats_capacity_bytes > 0"
  "resource:default/gke-rook-ceph-gke-rook-ceph-gke-node--c237685c-6h1k-disk": "kubelet_volume_stats_capacity_bytes > 0"
